name: teaching-station-deploy
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: station
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.deploy}
      POSTGRES_DB: station
    volumes:
      - deploy_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U station -d station"]
      interval: 3s
      timeout: 5s
      retries: 20
  migrate:
    image: teaching-station:local
    build: .
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://station:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/station?schema=public
      SEED_PASSWORD: ${SEED_PASSWORD:?Set SEED_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  app:
    image: teaching-station:local
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://station:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/station?schema=public
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
volumes:
  deploy_data:
