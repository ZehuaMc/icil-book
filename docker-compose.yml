services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: station
      POSTGRES_PASSWORD: station
      POSTGRES_DB: station
    ports:
      - "5432:5432"
    volumes:
      - station_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U station"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  station_data:
