name: teaching-station-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: station
      POSTGRES_PASSWORD: station
      POSTGRES_DB: station_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U station -d station_test"]
      interval: 2s
      timeout: 5s
      retries: 15
